<div class="container-sm">
    <div class="d-flex justify-content-center align-items-center p-4 gap-4 flex-wrap">
        <div class="flex-grow-1">
            <h2 class="fw-bold">Community Tasks</h2>
            <div class="text-secondary">{{HeaderSubTitle}}</div>
        </div>
        <div class="d-flex justify-content-center align-items-center gap-2 flex-wrap">
            <nav class="nav d-flex gap-2">
                <a class="btn btn-outline-secondary {%if not current_user.is_authenticated%}disabled{%endif%}" href="/">Dashboard</a>
                <a class="btn btn-outline-secondary {%if not current_user.is_authenticated%}disabled{%endif%}" href="/history">History</a>
            </nav>  
            <div class="d-flex gap-2">
                <button class="btn btn-primary d-flex align-items-center gap-1 {%if not current_user.is_authenticated%}disabled{%endif%}" data-bs-toggle="modal" data-bs-target="#createTaskModal">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pencil-square" viewBox="0 0 16 16">
                    <path d="M15.502 1.94a.5.5 0 0 1 0 .706L14.459 3.69l-2-2L13.502.646a.5.5 0 0 1 .707 0l1.293 1.293zm-1.75 2.456-2-2L4.939 9.21a.5.5 0 0 0-.121.196l-.805 2.414a.25.25 0 0 0 .316.316l2.414-.805a.5.5 0 0 0 .196-.12l6.813-6.814z"/>
                    <path fill-rule="evenodd" d="M1 13.5A1.5 1.5 0 0 0 2.5 15h11a1.5 1.5 0 0 0 1.5-1.5v-6a.5.5 0 0 0-1 0v6a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-11a.5.5 0 0 1 .5-.5H9a.5.5 0 0 0 0-1H2.5A1.5 1.5 0 0 0 1 2.5z"/>
                  </svg>
                  Create Task
                </button>
            </div>
            <div class="dropdown">
                {% if current_user.is_authenticated %}
                    <a href="#" class="dropdown-toggle btn btn-primary" id="DropdownUser" data-bs-toggle="dropdown">
                        {{ current_user.name }}
                    </a>
                {% else %}
                    <a href="#" class="dropdown-toggle btn btn-secondary" id="DropdownUser" data-bs-toggle="dropdown">
                        Signed Out
                    </a>
                {% endif %}
                <ul class="dropdown-menu" aria-labelledby="DropdownUser">
                    <li>
                        {% if current_user.is_authenticated %}
                            <a href="/signout" class="dropdown-item">
                                Sign Out
                            </a>
                        {% else %}
                            <a href="/signin" class="dropdown-item">
                                Sign In
                            </a>
                            <a href="/signup" class="dropdown-item">
                                Sign Up
                            </a>
                        {% endif %}
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
<hr class="m-0 mb-4"/>
