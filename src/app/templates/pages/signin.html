{%extends "base.html"%}

{% set PageTitle = "Sign In" %}
{% set HeaderSubTitle = "Sign In" %}

{%block BaseBody%}
<div class="container-sm flex-grow-1">
    <div class="p-4 d-flex align-items-center justify-content-center h-100">
        <div class="card p-4">
            <h4 class="mb-4 text-center fw-semibold">Sign In</h4>
            <form class="d-flex flex-column gap-3" method="POST" action="/api/signin">
                <div class="form-group">
                    <label for="signinInputEmail">Email</label>
                    <input required name="email" type="email" class="form-control" id="signinInputEmail" aria-describedby="signinEmailHelp" placeholder="Enter Email">
                    <small id="signinEmailHelp" class="form-text text-muted"></small>
                </div>
                <div class="form-group">
                    <label for="signinInputPassword">Password</label>
                    <input required name="password" type="password" class="form-control" id="signinInputPassword" aria-describedby="signinEmailHelp" placeholder="Enter Password">
                    <small id="signinEmailHelp" class="form-text text-muted"></small>
                </div>
                <button type="submit" class="mt-2 btn btn-primary">Sign In</button>
                <hr class="mt-2 mb-2">
                <a href="/signup" class="text-center small text-decoration-none">Or Sign Up</a>
            </form>
        </div>
    </div>
</div>
{%endblock%}
